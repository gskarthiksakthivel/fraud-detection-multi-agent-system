name: CI — Lint, Test, Contract Tests, Docker Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: fraud-agentic-ai

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint deps
        run: pip install ruff black isort

      - name: Ruff lint
        run: ruff check app/ tests/ evals/ scripts/

      - name: Black format check
        run: black --check app/ tests/ evals/ scripts/

      - name: isort import order
        run: isort --check-only app/ tests/ evals/ scripts/

  # ── Job 2: Unit Tests ───────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          OPENAI_API_KEY: sk-mock-key-for-ci
          LANGCHAIN_API_KEY: ls-mock-key-for-ci
          REDIS_URL: redis://localhost:6379
          ENVIRONMENT: test
        run: |
          pytest tests/test_agents.py tests/test_mcp_servers.py \
                 tests/test_guardrails.py tests/test_orchestrator.py \
                 -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ── Job 3: Contract Tests ───────────────────────────────────────────────────
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run contract tests
        env:
          OPENAI_API_KEY: sk-mock-key-for-ci
          LANGCHAIN_API_KEY: ls-mock-key-for-ci
          ENVIRONMENT: test
        run: |
          pytest tests/contract/ -v --tb=short
          echo "✅ All MCP and API contracts pass"

  # ── Job 4: Docker Build ─────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: contract-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Smoke test container
        run: |
          docker run -d --name test-container \
            -e OPENAI_API_KEY=sk-mock \
            -e LANGCHAIN_API_KEY=ls-mock \
            -e ENVIRONMENT=test \
            -p 8000:8000 \
            ${{ env.IMAGE_NAME }}:latest
          sleep 5
          curl --fail http://localhost:8000/health || exit 1
          docker stop test-container

      - name: Log in to ACR (on main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push to ACR (on main only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ secrets.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
