apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.env.OPENAI_API_KEY | quote }}
  LANGCHAIN_API_KEY: {{ .Values.env.LANGCHAIN_API_KEY | quote }}
  JWT_SECRET_KEY: {{ .Values.env.JWT_SECRET_KEY | default "change-me-in-prod" | quote }}
