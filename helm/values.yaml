replicaCount: 2
environment: staging

image:
  repository: yourregistry.azurecr.io/fraud-agentic-ai
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  OPENAI_API_KEY: ""
  LANGCHAIN_API_KEY: ""
  LANGCHAIN_TRACING_V2: "true"
  LANGCHAIN_PROJECT: "fraud-agentic-ai"
  REDIS_URL: "redis://redis-service:6379"
  CHROMA_HOST: "chromadb-service"
  CHROMA_PORT: "8001"
  BANKING_MCP_URL: "http://banking-mcp-service:8002"
  COMPLIANCE_MCP_URL: "http://compliance-mcp-service:8003"

mcpServers:
  banking:
    replicaCount: 1
    port: 8002
  compliance:
    replicaCount: 1
    port: 8003
